# Append to Services -> Services -> DNSMasq -> Additional Dnsmasq Options
# Logs DNS queries to RAM (/tmp/dns.log) instead of syslog, rotated daily to /jffs/logs.

# Optional: use AdGuard Public DNS for unlimited network-wide ad blocking
# server=94.140.14.14
# server=94.140.15.15

log-queries
log-async=25
log-facility=/tmp/dns.log
