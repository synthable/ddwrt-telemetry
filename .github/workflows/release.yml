name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: nflogd/go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite
        run: make test

      - name: Build release binaries
        run: |
          make build-all
          cd nflogd/dist
          sha256sum nflogd-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nflogd/dist/nflogd-armv7
            nflogd/dist/nflogd-arm64
            nflogd/dist/nflogd-mipsle
            nflogd/dist/SHA256SUMS.txt
